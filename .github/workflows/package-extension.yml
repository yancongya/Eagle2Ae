# 工作流名称
name: Package AE Extension

# 触发条件
on:
  # 手动触发
  workflow_dispatch:

# 任务定义
jobs:
  package-extension:
    # 运行环境
    runs-on: windows-latest
    
    # 步骤
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 设置Node.js环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      # 安装pnpm
      - name: Install pnpm
        run: npm install -g pnpm
      
      # 安装依赖
      - name: Install dependencies
        run: pnpm install
      
      # 打包AE扩展
      - name: Package AE Extension
        run: pnpm --filter eagle2ae_web run package:extension
      
      # 上传打包文件作为artifact
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: ae-extension-package
          path: apps/eagle2ae_web/dist/extension.zip