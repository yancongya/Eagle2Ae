<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Eagle2Ae</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 12px;
            background: #2b2b2b;
            color: #e0e0e0;
            line-height: 1.4;
        }

        .export-ae-panel {
            padding: 16px;
            max-width: 100%;
            height: calc(100vh - 32px);  /* 考虑到padding的高度 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
            border-bottom: 2px solid #00a0ff;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;  /* 防止标题收缩 */
        }
        
        #main-title {
            margin-right: auto; /* Push controls to the right */
            user-select: none; /* Make text non-selectable */
            -webkit-user-select: none; /* For Safari */
            -moz-user-select: none; /* For Firefox */
            -ms-user-select: none; /* For IE/Edge */
            cursor: pointer; /* Show hand cursor to indicate clickability */
            transition: color 0.2s ease; /* Add transition for color change on hover */
        }
        
        #main-title:hover {
            color: #00a0ff; /* Change color on hover to indicate it's clickable */
        }
        
        .header-controls {
            display: flex;
            gap: 8px;
        }
        
        .language-switch-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
        }

        .language-switch-btn:hover {
            background: #555555;
            color: #00a0ff;
            border-color: #00a0ff;
        }
        
        .language-icon {
            font-size: 12px;
            line-height: 1;
        }

        .title-settings-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
        }

        .title-settings-btn:hover {
            background: #555555;
            color: #00a0ff;
            border-color: #00a0ff;
        }

        .gear-icon {
            font-size: 16px;
            line-height: 1;
        }

        .gear-icon::before {
            content: '⚙';
        }

        h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .status-section, .files-section, .actions-section {
            background: #3c3c3c;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #555555;
            flex-shrink: 0;  /* 防止这些部分收缩 */
        }

        .log-section {
            background: #3c3c3c;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #555555;
            flex: 1;  /* 日志部分使用剩余空间 */
            display: flex;
            flex-direction: column;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #555555;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 500;
            color: #cccccc;
        }

        .status-value {
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        .status-value.connected {
            background: #1e5f1e;
            color: #90ee90;
        }

        .status-value.disconnected {
            background: #5f1e1e;
            color: #ff9999;
        }

        .status-value.error {
            background: #5f1e1e;
            color: #ff6666;
        }

        .files-list {
            max-height: 100px;
            overflow-y: auto;
        }

        .no-files {
            color: #999999;
            font-style: italic;
            text-align: center;
            padding: 16px;
            margin: 0;
        }

        .files-count {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            padding: 4px 8px;
            background: #555555;
            border-radius: 4px;
            font-size: 11px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            margin: 2px 0;
            background: #4a4a4a;
            border-radius: 4px;
            border-left: 3px solid #00a0ff;
        }

        .file-name {
            flex: 1;
            font-weight: 500;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-type {
            font-size: 10px;
            font-weight: 600;
            color: #cccccc;
            background: #666666;
            padding: 2px 6px;
            border-radius: 8px;
            margin-left: 8px;
        }



        .log-output {
            flex: 1;  /* 使用剩余空间 */
            min-height: 100px;
            max-height: none;
            overflow-y: auto;
            background: #1e1e1e;
            border-radius: 4px;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .log-entry {
            margin: 2px 0;
            padding: 2px 0;
        }

        .log-entry.log-info {
            color: #ffffff;
        }

        .log-entry.log-warning {
            color: #ffcc00;
        }

        .log-entry.log-error {
            color: #ff6666;
        }

        .log-time {
            color: #999999;
            margin-right: 8px;
        }

        /* 滚动条样式 */
        .log-output::-webkit-scrollbar,
        .files-list::-webkit-scrollbar {
            width: 6px;
        }

        .log-output::-webkit-scrollbar-track,
        .files-list::-webkit-scrollbar-track {
            background: #2b2b2b;
            border-radius: 3px;
        }

        .log-output::-webkit-scrollbar-thumb,
        .files-list::-webkit-scrollbar-thumb {
            background: #666666;
            border-radius: 3px;
        }

        .log-output::-webkit-scrollbar-thumb:hover,
        .files-list::-webkit-scrollbar-thumb:hover {
            background: #777777;
        }

        /* 设置对话框样式 */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .settings-dialog {
            background: #3c3c3c;
            border-radius: 8px;
            padding: 24px;
            min-width: 400px;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .settings-dialog h3 {
            margin: 0 0 20px 0;
            color: #ffffff;
            font-size: 18px;
            border-bottom: 2px solid #00a0ff;
            padding-bottom: 8px;
        }

        .setting-item {
            margin-bottom: 16px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #cccccc;
        }

        .setting-item input[type="text"],
        .setting-item input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #666666;
            border-radius: 4px;
            font-size: 12px;
            background: #2b2b2b;
            color: #ffffff;
        }

        .setting-item input[type="checkbox"] {
            margin-right: 8px;
        }

        .setting-item button {
            margin-left: 8px;
            padding: 6px 12px;
            background: #666666;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .setting-item button:hover {
            background: #777777;
        }

        .setting-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #555555;
        }

        .setting-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        #save-settings {
            background: #00a0ff;
            color: white;
        }

        #save-settings:hover {
            background: #0080cc;
        }

        #cancel-settings {
            background: #666666;
            color: white;
        }

        #cancel-settings:hover {
            background: #777777;
        }

        /* 服务信息样式 */
        .service-info {
            background: #2a4a5a;
            border: 1px solid #4a6a7a;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .service-description {
            margin: 0;
            color: #b3d9e6;
            font-size: 12px;
            line-height: 1.5;
        }

        .service-note {
            color: #999999;
            font-size: 11px;
            font-style: italic;
            margin: 4px 0 0 0;
        }

        .log-info {
            color: #999999;
            font-style: italic;
            text-align: center;
            padding: 16px;
            margin: 0;
        }

        /* ===== Light Theme Overrides (activated by html/body.theme-light) ===== */
        :is(html.theme-light, body.theme-light) {
            background: #ffffff !important;
            color: #111827 !important;
        }
        :is(html.theme-light, body.theme-light) .export-ae-panel { padding: 16px; }
        :is(html.theme-light, body.theme-light) h2 { color: #111827 !important; border-bottom-color: #3b82f6 !important; }
        :is(html.theme-light, body.theme-light) .title-settings-btn { background: #e5e7eb !important; color: #6b7280 !important; border-color: #d1d5db !important; }
        :is(html.theme-light, body.theme-light) .title-settings-btn:hover { background: #d1d5db !important; color: #2563eb !important; border-color: #2563eb !important; }
        :is(html.theme-light, body.theme-light) .language-switch-btn { background: #e5e7eb !important; color: #6b7280 !important; border-color: #d1d5db !important; }
        :is(html.theme-light, body.theme-light) .language-switch-btn:hover { background: #d1d5db !important; color: #2563eb !important; border-color: #2563eb !important; }
        :is(html.theme-light, body.theme-light) h3 { color: #111827 !important; }
        :is(html.theme-light, body.theme-light) .status-section,
        :is(html.theme-light, body.theme-light) .files-section,
        :is(html.theme-light, body.theme-light) .actions-section,
        :is(html.theme-light, body.theme-light) .log-section {
            background: #f9fafb !important;
            border-color: #e5e7eb !important;
        }
        :is(html.theme-light, body.theme-light) .status-item { border-bottom-color: #e5e7eb !important; }
        :is(html.theme-light, body.theme-light) .status-label { color: #374151 !important; }
        :is(html.theme-light, body.theme-light) .status-value { background: #eef2ff !important; color: #1f2937 !important; }
        :is(html.theme-light, body.theme-light) .status-value.connected { background: #dcfce7 !important; color: #166534 !important; }
        :is(html.theme-light, body.theme-light) .status-value.disconnected,
        :is(html.theme-light, body.theme-light) .status-value.error { background: #fee2e2 !important; color: #991b1b !important; }
        :is(html.theme-light, body.theme-light) .files-count { color: #111827 !important; background: #e5e7eb !important; }
        :is(html.theme-light, body.theme-light) .file-item { background: #ffffff !important; border-left-color: #3b82f6 !important; }
        :is(html.theme-light, body.theme-light) .file-name { color: #111827 !important; }
        :is(html.theme-light, body.theme-light) .file-type { background: #e5e7eb !important; color: #111827 !important; }
        :is(html.theme-light, body.theme-light) .no-files { color: #6b7280 !important; }
        :is(html.theme-light, body.theme-light) .log-output { background: #f3f4f6 !important; color: #111827 !important; }
        :is(html.theme-light, body.theme-light) .log-entry.log-info { color: #111827 !important; }
        :is(html.theme-light, body.theme-light) .log-entry.log-warning { color: #d97706 !important; }
        :is(html.theme-light, body.theme-light) .log-entry.log-error { color: #b91c1c !important; }
        :is(html.theme-light, body.theme-light) .log-time { color: #6b7280 !important; }
        :is(html.theme-light, body.theme-light) .log-output::-webkit-scrollbar-track,
        :is(html.theme-light, body.theme-light) .files-list::-webkit-scrollbar-track { background: #f3f4f6 !important; }
        :is(html.theme-light, body.theme-light) .log-output::-webkit-scrollbar-thumb,
        :is(html.theme-light, body.theme-light) .files-list::-webkit-scrollbar-thumb { background: #d1d5db !important; }
        :is(html.theme-light, body.theme-light) .log-output::-webkit-scrollbar-thumb:hover,
        :is(html.theme-light, body.theme-light) .files-list::-webkit-scrollbar-thumb:hover { background: #9ca3af !important; }
        :is(html.theme-light, body.theme-light) .settings-overlay { background: rgba(255,255,255,0.6) !important; }
        :is(html.theme-light, body.theme-light) .settings-dialog { background: #ffffff !important; box-shadow: 0 10px 30px rgba(0,0,0,0.15) !important; }
        :is(html.theme-light, body.theme-light) .settings-dialog h3 { color: #111827 !important; border-bottom-color: #3b82f6 !important; }
        :is(html.theme-light, body.theme-light) .setting-item label { color: #374151 !important; }
        :is(html.theme-light, body.theme-light) .setting-item input[type="text"],
        :is(html.theme-light, body.theme-light) .setting-item input[type="number"] {
            background: #ffffff !important; color: #111827 !important; border-color: #d1d5db !important;
        }
        :is(html.theme-light, body.theme-light) .setting-item button { background: #e5e7eb !important; color: #111827 !important; }
        :is(html.theme-light, body.theme-light) .setting-item button:hover { background: #d1d5db !important; }
        :is(html.theme-light, body.theme-light) .setting-actions { border-top-color: #e5e7eb !important; }
        :is(html.theme-light, body.theme-light) #save-settings { background: #3b82f6 !important; color: #ffffff !important; }
        :is(html.theme-light, body.theme-light) #save-settings:hover { background: #2563eb !important; }
        :is(html.theme-light, body.theme-light) #cancel-settings { background: #e5e7eb !important; color: #111827 !important; }
        :is(html.theme-light, body.theme-light) #cancel-settings:hover { background: #d1d5db !important; }

        /* View Transitions for language change */
        html.vt-lang::view-transition-old(root),
        html.vt-lang::view-transition-new(root) {
            animation-duration: 0.3s;
        }
    </style>

    <script type="text/javascript" src="js/plugin.js"></script>

<body>
    <div class="export-ae-panel">
        <h2>
            <a href="#" id="main-title-link" style="text-decoration: none; color: inherit;">
                <span id="main-title">Eagle2Ae</span>
            </a>
            <div class="header-controls">
                <button id="language-switch" class="language-switch-btn" title="切换语言">
                    <span class="language-icon">中</span>
                </button>
                <button id="title-settings-button" class="title-settings-btn" title="设置">
                    <span class="gear-icon"></span>
                </button>
            </div>
        </h2>

        <!-- 简化的服务状态 -->
        <div class="status-section">
            <h3>服务状态</h3>
            <div class="status-item">
                <span class="status-label">AE连接端口</span>
                <span id="ae-port" class="status-value">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">连接状态</span>
                <span id="connection-status" class="status-value disconnected">未连接</span>
            </div>
            <div class="status-item">
                <span class="status-label">运行时间</span>
                <span id="uptime" class="status-value">00:00:00</span>
            </div>
        </div>

        <!-- 当前选中文件 -->
        <div class="files-section">
            <h3>当前选中文件</h3>
            <div id="files-count" class="files-count">未选择文件</div>
            <div id="files-list" class="files-list" onclick="handleFileListClick()">
                <div class="no-files">请在Eagle中选择要导出的文件</div>
            </div>
        </div>



        <!-- 日志输出 -->
        <div class="log-section">
            <h3>操作日志</h3>
            <div id="log-output" class="log-output">
                <div class="log-info">等待操作日志...</div>
            </div>
        </div>
    </div>

    <!-- 设置对话框 -->
    <div id="settings-overlay" class="settings-overlay" style="display: none;">
        <div class="settings-dialog">
            <h3 id="settings-dialog-title">Eagle2Ae 设置</h3>

            <div class="setting-item">
                <label for="show-notifications" id="show-notifications-label">
                    <input type="checkbox" id="show-notifications" checked>
                    显示操作通知
                </label>
            </div>

            <div class="setting-item">
                <label for="server-port" id="server-port-label">服务器端口:</label>
                <input type="number" id="server-port" value="8080" min="1024" max="65535">
            </div>

            <div class="setting-item">
                <label for="clipboard-interval" id="clipboard-interval-label">剪切板检查间隔(毫秒):</label>
                <input type="number" id="clipboard-interval" value="1000" min="500" max="10000">
            </div>

            <div class="setting-actions">
                <button id="save-settings">保存设置</button>
                <button id="cancel-settings">取消</button>
            </div>
        </div>
    </div>

    <div id="message"></div>

    <script>
        // UI管理脚本
        let uiUpdateInterval = null;
        let startTime = Date.now();

        // 初始化UI
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Eagle2Ae UI 初始化');

            // 绑定事件
            bindEvents();

            // 初始化 i18n
            initializeI18n();

            // 开始定期更新UI
            startUIUpdates();

            // 初始化设置
            loadSettings();
        });

        function bindEvents() {
            // 标题栏设置按钮
            document.getElementById('title-settings-button').addEventListener('click', function() {
                showSettings();
            });

            // 语言切换按钮
            document.getElementById('language-switch').addEventListener('click', function() {
                switchLanguage();
            });

            // 设置对话框按钮
            document.getElementById('save-settings').addEventListener('click', function() {
                saveSettings();
            });

            document.getElementById('cancel-settings').addEventListener('click', function() {
                hideSettings();
            });

            // 点击遮罩关闭设置
            document.getElementById('settings-overlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    hideSettings();
                }
            });
        }

        // 文件列表点击处理函数
        function handleFileListClick() {
            // 直接发送选中的文件到AE
            handleManualExport();
        }

        function startUIUpdates() {
            // 每秒更新一次UI
            uiUpdateInterval = setInterval(updateUI, 1000);
            updateUI(); // 立即更新一次
        }

        async function updateUI() {
            // 更新选中文件列表
            await updateSelectedFiles();

            // 更新服务状态（如果有全局的eagle2ae实例）
            if (typeof eagle2ae !== 'undefined' && eagle2ae) {
                updateServiceStatus();
            }

            // 更新运行时间
            updateUptime();
        }

        async function updateSelectedFiles() {
            try {
                // 检查eagle对象是否可用
                if (typeof eagle === 'undefined') {
                    console.log('Eagle API不可用（可能在浏览器环境中运行）');
                    return;
                }
                
                const selectedItems = await eagle.item.getSelected();
                const filesCount = document.getElementById('files-count');
                const filesList = document.getElementById('files-list');
                const exportButton = document.getElementById('export-button');

                if (selectedItems && selectedItems.length > 0) {
                    // 使用 i18n 系统进行本地化
                    const countText = window.i18n ? 
                        window.i18n.t('selectedCount', { count: selectedItems.length }) : 
                        `已选择 ${selectedItems.length} 个文件`;
                    filesCount.textContent = countText;

                    // 显示文件列表
                    filesList.innerHTML = '';
                    selectedItems.slice(0, 10).forEach(item => { // 最多显示10个
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';

                        const fileName = document.createElement('span');
                        fileName.className = 'file-name';
                        // 使用原始文件名，但可以考虑本地化 "未知文件"
                        const fileNameText = item.name || (window.i18n ? window.i18n.t('unknownFile', { defaultValue: '未知文件' }) : '未知文件');
                        fileName.textContent = fileNameText;

                        const fileType = document.createElement('span');
                        fileType.className = 'file-type';
                        fileType.textContent = (item.ext || '').toUpperCase();

                        fileItem.appendChild(fileName);
                        fileItem.appendChild(fileType);
                        filesList.appendChild(fileItem);
                    });

                    if (selectedItems.length > 10) {
                        const moreItem = document.createElement('div');
                        moreItem.className = 'file-item';
                        moreItem.style.fontStyle = 'italic';
                        moreItem.style.color = '#666';
                        // 使用 i18n 系统进行本地化
                        const moreText = window.i18n ? 
                            `... ${window.i18n.t('andMore', { count: selectedItems.length - 10, defaultValue: `还有 ${selectedItems.length - 10} 个文件` })}` : 
                            `... 还有 ${selectedItems.length - 10} 个文件`;
                        moreItem.textContent = moreText;
                        filesList.appendChild(moreItem);
                    }

                } else {
                    // 使用 i18n 系统进行本地化
                    const noSelectionText = window.i18n ? 
                        window.i18n.t('noSelection') : 
                        '未选择文件';
                    filesCount.textContent = noSelectionText;
                    
                    const noFilesMessage = window.i18n ? 
                        window.i18n.t('selectFilesInEagle', { defaultValue: '请在Eagle中选择要导出的文件' }) : 
                        '请在Eagle中选择要导出的文件';
                    filesList.innerHTML = `<div class="no-files">${noFilesMessage}</div>`;
                }
            } catch (error) {
                console.error('更新选中文件失败:', error);
            }
        }

        function updateServiceStatus() {
            // 更新AE连接端口
            if (eagle2ae && eagle2ae.config && eagle2ae.config.wsPort) {
                document.getElementById('ae-port').textContent = eagle2ae.config.wsPort;
            } else {
                // 从设置中获取端口信息作为备选
                const settings = JSON.parse(localStorage.getItem('eagle2ae-settings') || '{}');
                if (settings.serverPort) {
                    document.getElementById('ae-port').textContent = settings.serverPort;
                } else {
                    document.getElementById('ae-port').textContent = '8080';
                }
            }

            // 更新连接状态
            if (eagle2ae && eagle2ae.httpServer && eagle2ae.httpServer.listening) {
                const connectedText = window.i18n ? window.i18n.t('connected') : '已连接';
                document.getElementById('connection-status').textContent = connectedText;
                document.getElementById('connection-status').className = 'status-value connected';
            } else if (eagle2ae && eagle2ae.aeStatus && eagle2ae.aeStatus.connected) {
                const connectedText = window.i18n ? window.i18n.t('connected') : '已连接';
                document.getElementById('connection-status').textContent = connectedText;
                document.getElementById('connection-status').className = 'status-value connected';
            } else {
                const disconnectedText = window.i18n ? window.i18n.t('disconnected') : '未连接';
                document.getElementById('connection-status').textContent = disconnectedText;
                document.getElementById('connection-status').className = 'status-value disconnected';
            }
        }

        function updateUptime() {
            const now = Date.now();
            const uptime = now - startTime;
            const hours = Math.floor(uptime / (1000 * 60 * 60));
            const minutes = Math.floor((uptime % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((uptime % (1000 * 60)) / 1000);
            
            const uptimeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('uptime').textContent = uptimeString;
        }



        async function handleManualExport() {
            try {
                // 检查eagle对象是否可用
                if (typeof eagle === 'undefined') {
                    const message = window.i18n ? 
                        window.i18n.t('eagleApiUnavailable') : 
                        'Eagle API不可用（可能在浏览器环境中运行）';
                    addLog(message, 'warning');
                    return;
                }
                
                const selectedItems = await eagle.item.getSelected();
                if (selectedItems && selectedItems.length > 0) {
                    const message = window.i18n ? 
                        window.i18n.t('logFileExportStart', { count: selectedItems.length }) : 
                        `开始发送 ${selectedItems.length} 个文件到AE...`;
                    addLog(message, 'info');

                    // 调用插件的导出功能
                    if (typeof eagle2ae !== 'undefined' && eagle2ae) {
                        await eagle2ae.handleSelectedFiles(selectedItems);
                        const successMessage = window.i18n ? 
                            window.i18n.t('exportSuccess') : 
                            '文件发送完成';
                        addLog(successMessage, 'info');
                    } else {
                        const notReadyMessage = window.i18n ? 
                            window.i18n.t('serviceNotReady') : 
                            '服务未就绪，请稍后重试';
                        addLog(notReadyMessage, 'warning');
                    }
                } else {
                    const noFilesMessage = window.i18n ? 
                        window.i18n.t('noFilesSelected') : 
                        '没有选中的文件';
                    addLog(noFilesMessage, 'warning');
                }
            } catch (error) {
                console.error('文件发送失败:', error);
                const failMessage = window.i18n ? 
                    window.i18n.t('exportFailed', { message: error.message }) : 
                    `发送失败: ${error.message}`;
                addLog(failMessage, 'error');
            }
        }



        // 日志去重缓存
        let lastLogMessage = null;
        let lastLogTime = null;
        let duplicateCount = 0;

        function addLog(message, type = 'info') {
            const logOutput = document.getElementById('log-output');
            const currentTime = new Date();
            const timeString = currentTime.toLocaleTimeString();

            // 检查是否是重复日志（5秒内的相同消息）
            const timeDiff = lastLogTime ? currentTime - lastLogTime : Infinity;
            if (lastLogMessage === message && timeDiff < 5000) {
                duplicateCount++;
                // 更新最后一条日志的重复计数
                const lastEntry = logOutput.lastElementChild;
                if (lastEntry && lastEntry.classList.contains('log-entry')) {
                    const countSpan = lastEntry.querySelector('.duplicate-count');
                    if (countSpan) {
                        countSpan.textContent = ` (×${duplicateCount + 1})`;
                    } else {
                        const newCountSpan = document.createElement('span');
                        newCountSpan.className = 'duplicate-count';
                        newCountSpan.style.color = '#888';
                        newCountSpan.textContent = ` (×${duplicateCount + 1})`;
                        lastEntry.appendChild(newCountSpan);
                    }
                }
                return;
            }

            // 重置重复计数
            lastLogMessage = message;
            lastLogTime = currentTime;
            duplicateCount = 0;

            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<span class="log-time">[${timeString}]</span>${message}`;

            // 如果是第一条日志，清除占位符
            if (logOutput.querySelector('.log-info')) {
                logOutput.innerHTML = '';
            }

            logOutput.appendChild(logEntry);

            // 保持最多50条日志
            const entries = logOutput.querySelectorAll('.log-entry');
            if (entries.length > 50) {
                entries[0].remove();
            }

            // 滚动到底部
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        function showSettings() {
            document.getElementById('settings-overlay').style.display = 'flex';
        }

        function hideSettings() {
            document.getElementById('settings-overlay').style.display = 'none';
        }
        
        function switchLanguage() {
            const currentLang = window.i18n.getLanguage();
            const newLang = currentLang === 'zh' ? 'en' : 'zh';
            window.i18n.setLanguage(newLang);
            
            // Update the language icon to reflect current language
            const langIcon = document.querySelector('.language-icon');
            if (langIcon) {
                langIcon.textContent = newLang === 'zh' ? '中' : 'EN';
            }
            
            // Update the title of the language switch button
            const langSwitchBtn = document.getElementById('language-switch');
            if (langSwitchBtn) {
                langSwitchBtn.title = newLang === 'zh' ? 'Switch to English' : '切换到中文';
            }
        }
        
        // Initialize UI with current language on load
        function initializeI18n() {
            if (window.i18n) {
                // Update the language icon to show current language
                const langIcon = document.querySelector('.language-icon');
                if (langIcon) {
                    const currentLang = window.i18n.getLanguage();
                    langIcon.textContent = currentLang === 'zh' ? '中' : 'EN';
                }
                
                // Update the title of the language switch button
                const langSwitchBtn = document.getElementById('language-switch');
                if (langSwitchBtn) {
                    const currentLang = window.i18n.getLanguage();
                    langSwitchBtn.title = currentLang === 'zh' ? 'Switch to English' : '切换到中文';
                }
                
                // Update all UI elements with current language
                window.i18n.updateUI();
            }
            
            // Bind the title click event to open the link
            setupTitleClickEvent();
        }
        
        function setupTitleClickEvent() {
            const titleLink = document.getElementById('main-title-link');
            if (titleLink) {
                titleLink.addEventListener('click', function(e) {
                    e.preventDefault(); // Prevent default anchor behavior
                    // Open the configured link in a new tab/window
                    window.open(TITLE_LINK_URL, '_blank');
                });
            }
        }

        // Listen for language updates from parent window
        window.addEventListener('message', function(event) {
            // Only process messages from our parent application
            if (event.source !== window.parent) {
                return;
            }
            
            if (event.data && event.data.type === 'LANGUAGE_UPDATE') {
                const newLang = event.data.language;
                if (!newLang) return;
                
                // Convert from main app language format to our format
                const eagleLang = newLang === 'en-US' ? 'en' : 'zh';
                
                // Check if View Transitions API is supported
                const supportsViewTransition = typeof document !== 'undefined' && 
                                               'startViewTransition' in document;
                
                // Function to update language
                const updateLanguage = () => {
                    if (window.i18n && window.i18n.getLanguage() !== eagleLang) {
                        window.i18n.setLanguage(eagleLang);
                    }
                };
                
                // Use View Transitions for smooth transition if supported
                if (supportsViewTransition) {
                    document.documentElement.classList.add('vt-lang');
                    document.startViewTransition(() => {
                        updateLanguage();
                    }).finished.finally(() => {
                        document.documentElement.classList.remove('vt-lang');
                    });
                } else {
                    // Fallback to direct update
                    updateLanguage();
                }
            }
            
            // 处理主题更新消息
            if (event.data && event.data.type === 'THEME_UPDATE') {
                const newTheme = event.data.theme;
                const clickPosition = event.data.clickPosition;
                if (!newTheme) return;
                
                // 检查是否支持 View Transitions API
                const supportsViewTransition = typeof document !== 'undefined' && 
                                               'startViewTransition' in document &&
                                               !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                
                // 更新主题的函数
                const updateTheme = () => {
                    if (newTheme === 'dark') {
                        document.documentElement.classList.remove('theme-light');
                        document.documentElement.classList.add('dark');
                        document.body.classList.remove('theme-light');
                        document.body.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        document.documentElement.classList.add('theme-light');
                        document.body.classList.remove('dark');
                        document.body.classList.add('theme-light');
                    }
                    
                    // 保存主题到 localStorage（虽然 Eagle 扩展没有主题按钮，但保持状态同步）
                    try {
                        localStorage.setItem('eagleTheme', newTheme);
                    } catch (e) {
                        console.warn('无法保存主题设置:', e);
                    }
                };
                
                // 如果支持 View Transitions，使用圆形蒙版动画
                if (supportsViewTransition) {
                    // 使用传递的点击位置，如果没有则使用默认位置（右上角）
                    const defaultX = window.innerWidth - 40;
                    const defaultY = 40;
                    const x = clickPosition?.x ?? defaultX;
                    const y = clickPosition?.y ?? defaultY;
                    const radius = Math.hypot(
                        Math.max(x, window.innerWidth - x),
                        Math.max(y, window.innerHeight - y)
                    );
                    
                    document.documentElement.classList.add('vt-theme');
                    const transition = document.startViewTransition(() => {
                        updateTheme();
                    });
                    
                    transition.ready.then(() => {
                        document.documentElement.animate(
                            {
                                clipPath: [
                                    `circle(0px at ${x}px ${y}px)`,
                                    `circle(${radius}px at ${x}px ${y}px)`
                                ]
                            },
                            {
                                duration: 520,
                                easing: 'ease-in-out',
                                pseudoElement: '::view-transition-new(root)'
                            }
                        );
                    }).catch(() => {
                        updateTheme();
                    }).finally(() => {
                        document.documentElement.classList.remove('vt-theme');
                    });
                } else {
                    // 不支持则直接更新
                    updateTheme();
                }
            }
        });

        function loadSettings() {
            // 从本地存储加载设置（如果有的话）
            try {
                const settings = JSON.parse(localStorage.getItem('eagle2ae-settings') || '{}');

                if (typeof settings.showNotifications === 'boolean') {
                    document.getElementById('show-notifications').checked = settings.showNotifications;
                }
                if (settings.serverPort) {
                    document.getElementById('server-port').value = settings.serverPort;
                }
                if (settings.clipboardInterval) {
                    document.getElementById('clipboard-interval').value = settings.clipboardInterval;
                }
            } catch (error) {
                console.error('加载设置失败:', error);
            }
        }

        function saveSettings() {
            try {
                const settings = {
                    showNotifications: document.getElementById('show-notifications').checked,
                    serverPort: parseInt(document.getElementById('server-port').value),
                    clipboardInterval: parseInt(document.getElementById('clipboard-interval').value)
                };

                localStorage.setItem('eagle2ae-settings', JSON.stringify(settings));
                const savedMessage = window.i18n ? 
                    window.i18n.t('settingsSaved') : 
                    '设置已保存';
                addLog(savedMessage, 'info');
                hideSettings();

                // 如果有全局实例，更新配置
                if (typeof eagle2ae !== 'undefined' && eagle2ae) {
                    eagle2ae.updateSettings(settings);

                    // 应用剪切板设置
                    if (eagle2ae.clipboardHandler) {
                        if (settings.clipboardInterval) {
                            eagle2ae.clipboardHandler.setCheckInterval(settings.clipboardInterval);
                        }
                    }
                }
            } catch (error) {
                console.error('保存设置失败:', error);
                const errorMessage = window.i18n ? 
                    window.i18n.t('settingsSaveFailed') : 
                    '保存设置失败';
                addLog(errorMessage, 'error');
            }
        }



        // 暴露给全局使用的函数
        window.uiAddLog = addLog;
        window.uiUpdateStatus = updateServiceStatus;

        // 初始日志
        setTimeout(() => {
            const initialMessage = window.i18n ? 
                window.i18n.t('uiStarted') : 
                'Eagle2Ae 管理界面已启动';
            addLog(initialMessage, 'info');
        }, 100);

        // 标题乱码转场动画
        (function initTitleAnimation() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initTitleAnimation);
                return;
            }
            
            const titleElement = document.getElementById('main-title');
            const titleLink = document.getElementById('main-title-link');

            if (!titleElement || !titleLink) return;

            const normalText = 'Eagle2Ae';
            const hoverText = 'Ae2Eagle';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*';

            let animationFrame = null;

            function scrambleText(fromText, toText, duration = 600) {
                const startTime = Date.now();
                const textLength = Math.max(fromText.length, toText.length);

                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    let result = '';
                    for (let i = 0; i < textLength; i++) {
                        const targetChar = toText[i] || '';

                        if (progress === 1) {
                            result += targetChar;
                        } else {
                            const charProgress = (progress * textLength - i) / 2;

                            if (charProgress > 1) {
                                result += targetChar;
                            } else if (charProgress > 0) {
                                result += chars[Math.floor(Math.random() * chars.length)];
                            } else {
                                result += fromText[i] || '';
                            }
                        }
                    }

                    titleElement.textContent = result;

                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    } else {
                        titleElement.textContent = toText;
                    }
                }

                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                }
                animate();
            }

            titleLink.addEventListener('mouseenter', function () {
                scrambleText(normalText, hoverText, 600);
            });

            titleLink.addEventListener('mouseleave', function () {
                scrambleText(hoverText, normalText, 600);
            });

            titleElement.textContent = normalText;
        })();
    </script>
